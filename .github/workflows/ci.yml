name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    env:
      # CI-only throwaway value for the AgentOS runtime guard. Not a real secret.
      OS_SECURITY_KEY: ci-only-agentos-key-not-a-secret
      # Integration tests must run (not skip) in CI.
      REQUIRE_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Create .env from example and export it (keeping the CI OS_SECURITY_KEY)
        run: |
          cp .env.example .env
          grep -E '^[A-Z_]+=' .env | grep -v '^OS_SECURITY_KEY=' >> "$GITHUB_ENV"
      - name: Start PostgreSQL for integration tests
        run: docker compose up -d --wait --wait-timeout 120 postgres
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Install Python (from .python-version)
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Tests (unit + PostgreSQL integration)
        run: uv run pytest
      - name: Boot API and check health and AgentOS auth
        run: |
          uv run uvicorn app.main:create_app --factory --app-dir apps/api \
            --port 8000 > api.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf localhost:8000/health > health.json && break; sleep 1; done
          cat health.json
          grep -q '"status":"ready"' health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/agents)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OS_SECURITY_KEY" localhost:8000/agents)" = 200
      - name: API log
        if: always()
        run: cat api.log || true
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tear down PostgreSQL
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  infrastructure:
    name: Infrastructure (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Create .env from example
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start PostgreSQL and Redis and wait until healthy
        run: docker compose up -d --wait --wait-timeout 120
      - name: Verify pgvector extension
        run: >-
          docker compose exec -T postgres
          psql -U platform -d platform -v ON_ERROR_STOP=1 -tAc
          "SELECT extversion FROM pg_extension WHERE extname = 'vector'" | grep -E '^[0-9]'
      - name: Verify Redis
        run: docker compose exec -T redis redis-cli ping | grep -x PONG
      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
