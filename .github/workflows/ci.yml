name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Install Python (from .python-version)
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  infrastructure:
    name: Infrastructure (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Create .env from example
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start PostgreSQL and Redis and wait until healthy
        run: docker compose up -d --wait --wait-timeout 120
      - name: Verify pgvector extension
        run: >-
          docker compose exec -T postgres
          psql -U platform -d platform -v ON_ERROR_STOP=1 -tAc
          "SELECT extversion FROM pg_extension WHERE extname = 'vector'" | grep -E '^[0-9]'
      - name: Verify Redis
        run: docker compose exec -T redis redis-cli ping | grep -x PONG
      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
