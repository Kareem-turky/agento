# Alembic configuration for PRODUCT-owned tables (schema "product").
# The target database is APP_DATABASE_URL (read in apps/api/migrations/env.py); there is
# deliberately no URL here. Agno's runtime schema (agno_runtime) is never touched.
#
#   uv run alembic upgrade head      # run explicitly by deployment / CI, never at API boot

[alembic]
script_location = %(here)s/apps/api/migrations
prepend_sys_path = %(here)s/apps/api
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
